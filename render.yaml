services:
  - type: web
    name: tienda-yeremer-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: tienda-yeremer-backend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://tienda-yeremer-frontend.onrender.com
      - key: STORE1_USER
        sync: false
      - key: STORE1_PASS
        sync: false
      - key: STORE2_USER
        sync: false
      - key: STORE2_PASS
        sync: false

  - type: web
    name: tienda-yeremer-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://tienda-yeremer-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
